[project]
name = "hegemony-demo"
version = "0.0.0"
description = "The public Hegemony demo: spec, generator, stories and installer"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "Jinja2==3.1.6",
    "PyYAML==6.0.3",
]

[project.scripts]
demo-gen = "hegemony_demo_gen.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["generator/hegemony_demo_gen"]

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "pytest==9.0.3",
    "reuse>=6.2.0",
    "ruff==0.14.2",
    "ty==0.0.50",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PTH", "S"]
ignore = [
    # subprocess is how the installer tests drive install.sh.
    "S603",
    "S607",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["generator", "scripts", "tests"]
exclude = ["**/__pycache__", ".venv", "dist"]

[tool.ty.rules]
possibly-unresolved-reference = "error"
possibly-missing-import = "error"
possibly-missing-attribute = "error"
deprecated = "error"
unused-ignore-comment = "error"
redundant-cast = "warn"

[tool.ty.terminal]
output-format = "full"
error-on-warning = true

[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
possibly-unresolved-reference = "warn"
possibly-missing-attribute = "warn"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
