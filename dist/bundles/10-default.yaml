flows:
- name: Announce service prefix
  description: Advertise a service address on the edge routers after approval. Collects the running configuration
    before and after the change, fails unless the change shows up in the comparison, and checks that the
    core router learned the new route.
  tags:
    story: s1
  definition:
    run_limits:
      max_concurrent_runs: 1
      cooldown_seconds: 60
    graph:
      nodes:
      - id: start
        name: Start
        type: start
        position_x: -15
        position_y: 165
      - id: approval
        name: Approve the change
        type: approval
        position_x: 195
        position_y: 150
        params:
          title: Approve the service prefix announcement
          message: Advertise the requested service address on the selected edge routers? The address and
            the change reference are in this run's inputs.
          timeout_seconds: 3600
        policy:
          timeout_sec: 3600
          retries: 0
          on_failure: FAIL_RUN
          evidence_required: false
      - id: precheck
        name: Evidence before
        type: step
        handler: netcli.collect_evidence
        tags:
          phase: PREPARE
          evidence: pre
        port_anchors:
          failure: SE
        position_x: 540
        position_y: 30
        target_selectors:
        - type: role
          role: change_targets
        params:
          commands:
          - show running-config
          - show ip route ospf
        policy:
          timeout_sec: 120
          retries: 0
          on_failure: FAIL_RUN
          evidence_required: true
      - id: apply
        name: Apply the change
        type: step
        handler: netcli.execute
        tags:
          phase: IMPLEMENTATION
          risk: high
        port_anchors:
          failure: SE
        position_x: 825
        position_y: 30
        target_selectors:
        - type: role
          role: change_targets
        params:
          commands:
          - configure terminal
          - interface lo
          - ip address {{ inputs.service_address }}/32
          - router ospf
          - network {{ inputs.service_address }}/32 area 0
          - end
        policy:
          timeout_sec: 120
          retries: 0
          on_failure: FAIL_RUN
          evidence_required: false
      - id: postcheck
        name: Evidence after
        type: step
        handler: netcli.collect_evidence
        tags:
          phase: VERIFY
          evidence: post
        port_anchors:
          failure: SE
        position_x: 1125
        position_y: 30
        target_selectors:
        - type: role
          role: change_targets
        params:
          commands:
          - show running-config
          - show ip route ospf
        policy:
          timeout_sec: 120
          retries: 0
          on_failure: FAIL_RUN
          evidence_required: true
      - id: compare
        name: The configuration changed
        type: step
        handler: evidence.compare
        tags:
          phase: VERIFY
          evidence: diff
        port_anchors:
          failure: NbE
        position_x: 1425
        position_y: 30
        params:
          precheck_step_id: precheck
          postcheck_step_id: postcheck
          comparison_type: changed
          artifact_name_pattern: '*show running-config'
        policy:
          timeout_sec: 60
          retries: 0
          on_failure: FAIL_RUN
          evidence_required: false
      - id: core_view
        name: The core learned the route
        type: step
        handler: netcli.collect_evidence
        tags:
          phase: VERIFY
        port_anchors:
          failure: S
        position_x: 1785
        position_y: 30
        target_selectors:
        - type: role
          role: observers
        params:
          commands:
          - show ip route {{ inputs.service_address }}/32
        policy:
          timeout_sec: 120
          retries: 1
          on_failure: FAIL_RUN
          evidence_required: true
      - id: change-completed
        name: Change completed
        position_x: 2145
        position_y: 60
        terminal_status: success
        type: terminal
      - id: no-change-detected
        name: No change detected
        position_x: 2145
        position_y: -90
        terminal_status: success
        type: terminal
      - id: unexpected-failure
        name: Unexpected failure
        port_anchors:
          in: N
        position_x: 945
        position_y: 465
        terminal_status: failure
        type: terminal
      edges:
      - source: start:start
        target: approval
      - source: approval:approved
        target: precheck
      - source: approval:rejected
        target: unexpected-failure
      - source: approval:expired
        target: unexpected-failure
      - source: precheck:success
        target: apply
      - source: precheck:failure
        target: unexpected-failure
      - source: apply:success
        target: postcheck
      - source: apply:failure
        target: unexpected-failure
      - source: postcheck:success
        target: compare
      - source: postcheck:failure
        target: unexpected-failure
      - source: compare:success
        target: core_view
      - source: compare:failure
        target: no-change-detected
      - source: core_view:success
        target: change-completed
      - source: core_view:failure
        target: unexpected-failure
    form:
      nodes:
      - id: sec_targets
