- name: Maintenance window
  description: Drain traffic away from the edge routers (OSPF max-metric), let it settle, watch reachability,
    then wait for someone to close the window. If nobody does before the deadline, the window closes itself
    and the routers are restored.
  tags:
    story: s2
  definition:
    run_limits:
      max_concurrent_runs: 1
    graph:
      nodes:
      - id: start
        name: Start
        type: start
        position_x: 0
        position_y: 200
      - id: drain
        name: Drain the edge routers
        type: step
        handler: netcli.execute
        tags:
          phase: IMPLEMENTATION
          risk: medium
        port_anchors:
          failure: SE
        position_x: 195
        position_y: 165
        target_selectors:
        - type: role
          role: window_targets
        params:
          commands:
          - configure terminal
          - router ospf
          - max-metric router-lsa administrative
          - end
        policy:
          timeout_sec: 120
          retries: 0
          on_failure: FAIL_RUN
          evidence_required: false
      - id: undo_drain
        name: Undo the drain
        type: step
        handler: netcli.execute
        tags:
          phase: IMPLEMENTATION
        port_anchors:
          in: N
          failure: S
          success: E
        position_x: 195
        position_y: 450
        target_selectors:
        - type: role
          role: window_targets
        params:
          commands:
          - configure terminal
          - router ospf
          - no max-metric router-lsa administrative
          - end
        policy:
          timeout_sec: 120
          retries: 1
          on_failure: CONTINUE
          evidence_required: false
      - id: settle
        name: Let traffic settle
        type: step
        handler: general.sleep
        tags:
          phase: IMPLEMENTATION
        port_anchors:
          failure: SE
        position_x: 540
        position_y: 165
        params:
          duration_seconds: 30
          message: Waiting for traffic to move off the drained routers
        policy:
          timeout_sec: 120
          retries: 2
          on_failure: FAIL_RUN
          evidence_required: false
      - id: watch
        name: Watch reachability
        type: step
        handler: monitor.connectivity
        tags:
          phase: VERIFY
        position_x: 1005
        position_y: 15
        target_selectors:
        - type: ip
          addresses:
          - 172.28.103.21
          - 172.28.103.22
        params:
          check_type: tcp_connect
          port: 22
          attempt_timeout_seconds: 3
          interval_ms: 5000
          schedule_mode: until_join
          count: 12
        policy:
          on_failure: CONTINUE
          evidence_required: false
      - id: close_gate
        name: Close the window
        type: approval
        port_anchors:
          approved: EbN
          expired: SEbE
          rejected: NE
        position_x: 1005
        position_y: 195
        params:
          title: Close the maintenance window
          message: The edge routers are drained. Approve to restore them now. Reject to keep them drained.
            With no decision in 15 minutes the window closes itself and the routers are restored.
          timeout_seconds: 900
        policy:
          timeout_sec: 900
          retries: 0
          on_failure: FAIL_RUN
          evidence_required: false
      - id: restore
        name: Restore the edge routers
        type: step
        handler: netcli.execute
        tags:
          phase: IMPLEMENTATION
        port_anchors:
          failure: S
          in: SW
        position_x: 1575
        position_y: 165
        target_selectors:
        - type: role
          role: window_targets
        params:
          commands:
          - configure terminal
          - router ospf
          - no max-metric router-lsa administrative
          - end
        policy:
          timeout_sec: 120
          retries: 1
          on_failure: FAIL_RUN
          evidence_required: false
      - id: verify
        name: Evidence after the window
        type: step
        handler: netcli.collect_evidence
        tags:
          phase: VERIFY
        port_anchors:
          failure: S
        position_x: 1905
        position_y: 165
        target_selectors:
        - type: role
          role: window_targets
        params:
          commands:
          - show running-config
          - show ip ospf neighbor
        policy:
          timeout_sec: 120
          retries: 0
          on_failure: FAIL_RUN
          evidence_required: true
      - id: done
        name: Window closed
        type: terminal
        terminal_status: success
        position_x: 2295
        position_y: 195
      - id: kept_open
        name: Routers left drained
        type: terminal
        terminal_status: failure
        position_x: 1575
        position_y: 15
      - id: failed
        name: Window failed
        type: terminal
        terminal_status: failure
        port_anchors:
          in: N
        position_x: 1095
        position_y: 600
      - id: fork
        name: Fork
        port_anchors:
          fork: E
          in: W
        position_x: 840
        position_y: 180
        type: fork
      edges:
      - source: start:start
        target: drain
      - source: drain:success
        target: settle
      - source: drain:failure
        target: undo_drain
      - source: undo_drain:success
        target: failed
      - source: undo_drain:failure
        target: failed
      - source: settle:success
        target: fork
      - source: settle:failure
        target: restore
      - source: close_gate:approved
        target: restore
      - source: close_gate:expired
        target: restore
      - source: close_gate:rejected
        target: kept_open
      - source: restore:success
        target: verify
      - source: restore:failure
        target: failed
      - source: verify:success
        target: done
      - source: verify:failure
        target: failed
      - source: fork:fork
        target: close_gate
      - source: fork:fork
        target: watch
    form:
      nodes:
      - id: sec_targets
        kind: section
        position_x: 80
        position_y: 60
        width: 480
        height: 200
        data:
          label: Routers
          runtime_layout: card
          collapsible: false
      - id: f_targets
        kind: field
        parent_id: sec_targets
        position_x: 40
        position_y: 60
        data:
          label: Edge routers to drain
          field_id: targets
          field_type: inventory.device
          required: true
          default_value:
          - dlp1-edge-01
          - dlp1-edge-02
          config:
            role: window_targets
            multiple: true
            option_source:
              kind: inventory.devices
      edges: []
- name: Service as code
  description: Declare a routed service in OpenTofu with its state kept in Hegemony. Change the routers
    only where the declaration changed, or where a router no longer matches the stored state, and only
    after approval. Then prove OpenTofu finds nothing left and the provider receives the route.
  tags:
    story: s4
  definition:
    graph:
      annotations:
      - color: green
        height: 640
        id: note
        kind: text
        position_x: 150.0
        position_y: -405.0
        text: '## **PREPARATION**'
        width: 960
      - color: yellow
        height: 610
        id: note-1
        kind: text
        position_x: 1290.0
        position_y: -360.0
        text: '## **APPROVALS**'
        width: 420
      - color: red
        height: 595
        id: note-2
        kind: text
        position_x: 2025.0
        position_y: -330.0
        text: '## **IMPLEMENTATION**'
        width: 915
      - color: blue
        height: 370
        id: note-3
        kind: text
        position_x: 2490.0
        position_y: 480.0
        text: '## **VERIFICATION**'
        width: 1620
      nodes:
      - id: start
        name: Start
        type: start
        position_x: -45
        position_y: 210
      - id: observed
        name: What the routers carry
        type: step
        handler: netcli.collect_evidence
        tags:
          phase: PRECHECK
          evidence: pre
        port_anchors:
          failure: SE
          in: SW
          success: N
        position_x: 180
        position_y: 45
        target_selectors:
        - type: role
          role: service_targets
        params:
          commands:
          - show interface lo json
        policy:
          timeout_sec: 120
          retries: 0
          on_failure: CONTINUE
          evidence_required: true
      - id: plan
        name: Plan
        type: step
        handler: tf.plan
        tags:
          phase: PREPARE
          kind: CHECK
        port_anchors:
          failure: SE
          in: S
          success: N
        position_x: 165
        position_y: -195
        execution_affinity: shared
        params:
          engine: opentofu
          state: managed
          state_name: edge-services
          hold_until_apply: true
          vars:
            service_name: '{{ inputs.service_name }}'
            service_address: '{{ inputs.service_address }}'
            routers: '{{ targets.service_targets | map(attribute=''name'') | list | tojson }}'
            observed: '{{ steps.observed.output.devices | tojson }}'
          lock_timeout: 120s
          timeout_seconds: 240
          egress_mode: deny-all
        policy:
          timeout_sec: 300
          retries: 0
          on_failure: CONTINUE
          evidence_required: false
      - id: dropped
        name: Routers dropped?
        type: branch
        branch_mode: rules
        port_anchors:
          else: E
          error: S
        position_x: 360
        position_y: -390
        cases:
        - id: c_dropped
          label: Dropped
          when: (steps.plan.output.outputs.get('routers') or []) | reject('in', targets.service_targets
            | map(attribute='name') | list) | list | length > 0
      - id: code_changed
        name: Code changed?
        type: branch
        branch_mode: rules
        port_anchors:
          else: SE
          error: S
        position_x: 615
        position_y: -225
        cases:
        - id: c_changed
          label: Changes
          when: steps.plan.output.has_changes
      - id: matches
        name: Routers match the state?
        type: step
        handler: evidence.assert
        tags:
          phase: PRECHECK
        port_anchors:
          in: NW
          success: SbE
        position_x: 795
        position_y: 15
        params:
          artifact_step_id: observed
          target_role: service_targets
          command: show interface lo json
          operator: contains
          expected: '"{{ steps.plan.output.outputs.address }}"'
          message: A router no longer carries what the stored state says; someone changed it outside this
            flow.
        policy:
          timeout_sec: 60
          retries: 0
          on_failure: CONTINUE
          evidence_required: false
      - id: approve_change
        name: Approve the plan
        type: approval
        port_anchors:
          approved: NE
          expired: SbW
          rejected: SWbS
        position_x: 1350
        position_y: -270
        params:
          title: 'Apply {{ inputs.service_name }}: {{ steps.plan.output.summary }}'
          message: '{{ steps.plan.output.summary }}. Service {{ inputs.service_name }} on {{ inputs.service_address
            }}/32. The plan step''s artifacts show each router''s change against the stored state; approving
            applies exactly that plan and pushes the result to the edge routers.'
          timeout_seconds: 3600
        policy:
          timeout_sec: 3600
          retries: 0
          on_failure: FAIL_RUN
          evidence_required: false
      - id: approve_repair
        name: Approve the repair
        type: approval
        port_anchors:
          approved: EbS
          expired: NbW
          rejected: NWbN
        position_x: 1365
        position_y: 105
        params:
          title: Repair {{ inputs.service_name }} on {{ steps.matches.output.failed | map('replace', ':show
            interface lo json', '') | join(', ') }}
          message: The code did not change, but {{ steps.matches.output.failed | map('replace', ':show
            interface lo json', '') | join(', ') }} no longer carries {{ steps.plan.output.outputs.address
            }} as the stored state says. Approving pushes the stored state to the edge routers again.
          timeout_seconds: 3600
        policy:
          timeout_sec: 3600
          retries: 0
          on_failure: FAIL_RUN
          evidence_required: false
      - id: apply
        name: Apply
        type: step
        handler: tf.apply
        tags:
          phase: IMPLEMENTATION
          risk: high
        port_anchors:
          success: S
        position_x: 2085
        position_y: -240
        execution_affinity: shared
        params:
          plan_step: plan
          lock_timeout: 120s
          timeout_seconds: 240
          egress_mode: deny-all
        policy:
          timeout_sec: 300
          retries: 0
          on_failure: CONTINUE
          evidence_required: false
      - id: moved
        name: Address moved?
        type: branch
        branch_mode: rules
        port_anchors:
          error: NNE
          in: NNW
        position_x: 2055
        position_y: 75
        cases:
        - id: c_moved
          label: Moved
          when: steps.plan.output.outputs.get('address') and steps.plan.output.outputs.get('address')
            != steps.apply.output.outputs.address
      - id: remove_old
        name: Remove the old address
        type: step
        handler: netcli.execute
        tags:
          phase: IMPLEMENTATION
          risk: high
        port_anchors:
          failure: NE
          success: SbW
        position_x: 2400
        position_y: -30
        target_selectors:
        - type: role
          role: service_targets
        params:
          commands:
          - configure terminal
          - interface lo
          - no ip address {{ steps.plan.output.outputs.address }}
          - router ospf
          - no network {{ steps.plan.output.outputs.address }} area 0
          - end
        policy:
          timeout_sec: 120
          retries: 0
          on_failure: CONTINUE
          evidence_required: false
      - id: push
        name: Push to the routers
        type: step
        handler: netcli.execute
        tags:
          phase: IMPLEMENTATION
          risk: high
        port_anchors:
          failure: N
          success: S
        position_x: 2670
        position_y: 90
        target_selectors:
        - type: role
          role: service_targets
        params:
          commands:
          - configure terminal
          - interface lo
          - description {{ steps.apply.output.outputs.description }}
          - ip address {{ steps.apply.output.outputs.address }}
          - router ospf
          - network {{ steps.apply.output.outputs.address }} area 0
          - end
        policy:
          timeout_sec: 120
          retries: 0
          on_failure: CONTINUE
          evidence_required: false
      - id: after
        name: What the routers carry now
        type: step
        handler: netcli.collect_evidence
        tags:
          phase: VERIFY
          evidence: post
        port_anchors:
          failure: NE
          in: N
        position_x: 2535
        position_y: 630
        target_selectors:
        - type: role
          role: service_targets
        params:
          commands:
          - show interface lo json
          - show bgp ipv4 unicast {{ steps.apply.output.outputs.address }}
        policy:
          timeout_sec: 120
          retries: 0
          on_failure: CONTINUE
          evidence_required: true
      - id: no_leftover
        name: No old address left?
        type: step
        handler: evidence.assert
        tags:
          phase: VERIFY
        port_anchors:
          failure: N
        position_x: 2925
        position_y: 585
        params:
          artifact_step_id: after
          target_role: service_targets
          command: show interface lo json
          operator: contains
          expected: '"{{ steps.apply.output.outputs.address }}"'
          match_scope: lines
          line_filter: '"10\.255\.100\.'
          min_lines: 1
          message: A router still carries a service address other than {{ steps.apply.output.outputs.address
            }}; remove it from the router's loopback and OSPF by hand.
        policy:
          timeout_sec: 60
          retries: 0
          on_failure: CONTINUE
          evidence_required: false
      - id: converged
        name: Plan again
        type: step
        handler: tf.plan
        tags:
          phase: VERIFY
          kind: CHECK
        port_anchors:
          failure: NNW
        position_x: 3225
        position_y: 630
        params:
          engine: opentofu
          state: managed
          state_name: edge-services
          vars:
            service_name: '{{ inputs.service_name }}'
            service_address: '{{ inputs.service_address }}'
            routers: '{{ targets.service_targets | map(attribute=''name'') | list | tojson }}'
            observed: '{{ steps.after.output.devices | tojson }}'
          lock_timeout: 120s
          timeout_seconds: 240
          egress_mode: deny-all
        policy:
          timeout_sec: 300
          retries: 0
          on_failure: CONTINUE
          evidence_required: false
      - id: nothing_left
        name: Nothing left to change?
        type: branch
        branch_mode: rules
        port_anchors:
          else: NbW
          error: N
        position_x: 3480
        position_y: 615
        cases:
        - id: c_converged
          label: Converged
          when: not steps.converged.output.has_changes
      - id: upstream
        name: Announced upstream?
        type: step
        handler: evidence.assert
        tags:
          phase: VERIFY
        port_anchors:
          failure: NbW
        position_x: 3825
        position_y: 630
        params:
          artifact_step_id: after
          target_role: service_targets
          command: show bgp ipv4 unicast {{ steps.apply.output.outputs.address }}
          operator: contains
          expected: Advertised to
          message: An edge router does not announce the service to the provider.
        policy:
          timeout_sec: 60
          retries: 0
          on_failure: CONTINUE
          evidence_required: false
      - id: done
        name: Service live
        type: terminal
        terminal_status: success
        position_x: 4245
        position_y: 645
      - id: dropped_routers
        name: Routers left out of the state
        type: terminal
        terminal_status: failure
        position_x: 705
        position_y: -540
      - id: in_place
        name: Nothing to change
        type: terminal
        terminal_status: success
        port_anchors:
          in: NbW
        position_x: 825
        position_y: 285
      - id: rejected
        name: Not applied
        type: terminal
        terminal_status: success
        position_x: 1740
        position_y: -90
      - id: failed
        name: Failed
        type: terminal
        terminal_status: failure
        port_anchors:
          in: NWbN
        position_x: 600
        position_y: 285
      - id: failure
        name: Failure
        port_anchors:
          in: SWbS
        position_x: 3045
        position_y: -405
        terminal_status: failure
        type: terminal
      edges:
      - source: start:start
        target: observed
      - source: observed:success
        target: plan
      - source: observed:failure
        target: failed
      - source: plan:success
        target: dropped
      - source: dropped:case:c_dropped
        target: dropped_routers
      - source: dropped:else
        target: code_changed
      - source: dropped:error
        target: failed
      - source: plan:failure
        target: failed
      - source: code_changed:case:c_changed
        target: approve_change
      - source: code_changed:else
        target: matches
      - source: code_changed:error
        target: failed
      - source: matches:success
        target: in_place
      - source: matches:failure
        target: approve_repair
      - source: approve_change:approved
        target: apply
      - source: approve_change:rejected
        target: rejected
      - source: approve_change:expired
        target: rejected
      - source: approve_repair:approved
        target: apply
        waypoints:
        - x: 1935.0
          y: 30.0
      - source: approve_repair:rejected
        target: rejected
      - source: approve_repair:expired
        target: rejected
      - source: apply:success
        target: moved
      - source: apply:failure
        target: failure
      - source: moved:case:c_moved
        target: remove_old
      - source: moved:else
        target: push
      - source: moved:error
        target: failure
      - source: remove_old:success
        target: push
      - source: remove_old:failure
        target: failure
      - source: push:success
        target: after
      - source: push:failure
        target: failure
      - source: after:success
        target: no_leftover
      - source: no_leftover:success
        target: converged
      - source: no_leftover:failure
        target: failure
      - source: after:failure
        target: failure
      - source: converged:success
        target: nothing_left
      - source: converged:failure
        target: failure
      - source: nothing_left:case:c_converged
        target: upstream
      - source: nothing_left:else
        target: failure
      - source: nothing_left:error
        target: failure
      - source: upstream:success
        target: done
      - source: upstream:failure
        target: failure
    form:
      nodes:
      - id: sec_service
        kind: section
        position_x: 80
        position_y: 60
        width: 480
        height: 340
        data:
          label: Service
          runtime_layout: card
          collapsible: false
      - id: f_service_name
        kind: field
