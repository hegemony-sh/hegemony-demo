- name: Configuration backup
  description: Read every selected router's running configuration with Ansible and commit it to the backup
    repository in Git, one file per router. Nothing is committed when nothing changed, so each commit
    is a change to the network.
  tags:
    story: s5
  definition:
    graph:
      nodes:
      - id: start
        name: Start
        type: start
        position_x: 0
        position_y: 120
      - id: backup
        name: Back up to Git
        type: step
        handler: ansible.playbook
        tags:
          phase: VERIFY
          kind: CHECK
        position_x: 270
        position_y: 105
        target_selectors:
        - type: role
          role: backup_targets
        params:
          playbook: backup.yml
          secrets:
            git_username: '{{ secret(''vault://orgs/default/secrets/ops/git/https/username'') }}'
            git_password: '{{ secret(''vault://orgs/default/secrets/ops/git/https/password'') }}'
          extra_vars:
            git_url: http://172.28.103.10:3000/netops/config-backups.git
            commit_message: Configuration backup, Hegemony run {{ run_id }}
          timeout_seconds: 300
          egress_mode: allow-listed
          egress_allow:
          - 172.28.103.0/24:22/tcp
          - 172.28.103.10/32:3000/tcp
        policy:
          timeout_sec: 330
          retries: 0
          on_failure: FAIL_RUN
          evidence_required: false
      - id: done
        name: Backed up
        type: terminal
        terminal_status: success
        position_x: 600
        position_y: 90
      - id: failure
        name: Failure
        position_x: 600
        position_y: 180
        terminal_status: failure
        type: terminal
      edges:
      - source: start:start
        target: backup
      - source: backup:success
        target: done
      - source: backup:failure
        target: failure
    form:
      nodes:
      - id: sec_targets
        kind: section
        position_x: 80
        position_y: 60
        width: 480
        height: 200
        data:
          label: Routers
          runtime_layout: card
          collapsible: false
      - id: f_targets
        kind: field
        parent_id: sec_targets
        position_x: 40
        position_y: 60
        data:
          label: Routers to back up
          field_id: targets
          field_type: inventory.device
          required: true
          description: Each router's running configuration lands in http://localhost:3000/netops/config-backups.
          default_value:
          - dlp1-edge-01
          - dlp1-edge-02
          - dlp1-core-01
          config:
            role: backup_targets
            multiple: true
            option_source:
              kind: inventory.devices
flow_attachments:
- flow: Service as code
  filename: service.tf
  content: |
    # SPDX-FileCopyrightText: 2026 Rexonix s.r.o.
    # SPDX-FileContributor: Jakub Trávník <jakub.travnik@gmail.com>
    #
    # SPDX-License-Identifier: AGPL-3.0-or-later
    #
    # The declared state of one routed service: which edge routers carry its
    # address, and how. One terraform_data resource per router, so a plan says
    # exactly which routers change. Hegemony keeps the state (managed state,
    # versioned and locked), so every plan compares against what the last apply
    # left: a new service is added, a new address shows as a change from the old
    # one (the flow then removes the old address), and the same values again
    # change nothing. Only built-in resources: there is no provider to download
    # (FRR has no OpenTofu provider), so the flow writes the apply's outputs to
    # the routers, with their logins from Hegemony.
    #
    # The flow also hands in what each router's loopback carries right now
    # (`observed`). OpenTofu uses it as a safety check: it refuses to take an
    # address a router already uses for something it does not manage.

    variable "service_name" {
      type        = string
      description = "Short service identifier, written into the loopback's description."

      validation {
        condition     = can(regex("^[a-z][a-z0-9-]{1,30}$", var.service_name))
        error_message = "service_name is a short lowercase identifier."
      }
    }

    variable "service_address" {
      type        = string
      description = "Host address the service answers on, announced as a /32."

      validation {
        condition     = can(regex("^10\\.255\\.100\\.([1-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9]|25[0-4])$", var.service_address))
        error_message = "service_address is a host address in 10.255.100.0/24."
      }
    }

    variable "routers" {
      type        = list(string)
      description = "Edge routers that carry the service address."
    }

    variable "observed" {
      # The collect step's output.devices: per router, whether the collection
      # worked and each command's text.
      type        = any
      description = "What each router reported, from the flow's collect step."
    }

    locals {
      address     = "${var.service_address}/32"
      description = "svc ${var.service_name} managed-by-opentofu"
      marker      = "managed-by-opentofu"
      command     = "show interface lo json"

      # Per router: the loopback as FRR reports it (empty when it did not answer).
      loopback = {
        for router in var.routers : router => try(
          jsondecode(var.observed[router].commands[local.command]).lo, {}
        )
      }
    }

    resource "terraform_data" "service" {
      for_each = toset(var.routers)

      input = {
        address     = local.address
        description = local.description
      }

      lifecycle {
        precondition {
          condition     = try(var.observed[each.key].success, false)
          error_message = "${each.key} did not report its loopback, so the plan cannot tell whether the address is free."
        }

        # The address is free, or already ours: a loopback that carries it under
        # a description without the marker belongs to something else.
        precondition {
          condition = (
            !contains([for a in try(local.loopback[each.key].ipAddresses, []) : a.address], local.address)
            || strcontains(try(local.loopback[each.key].description, ""), local.marker)
          )
          error_message = "${each.key} already uses ${local.address} for something OpenTofu does not manage."
        }
      }
    }

    # What the flow's push step writes to the routers: the plan decides it, not
    # the flow's inputs. The plan step reports these as the state held them
    # before its changes, which is how the flow finds an address to remove.
    output "address" {
      description = "The service address with its prefix length, as the routers carry it."
      value       = local.address
    }

    output "description" {
      description = "The loopback description that marks the address as managed here."
      value       = local.description
    }

    output "routers" {
      description = "The routers that carry the service."
      value       = sort(var.routers)
    }
- flow: Configuration backup
  filename: backup.yml
  content: |
    # SPDX-FileCopyrightText: 2026 Rexonix s.r.o.
    # SPDX-FileContributor: Jakub Trávník <jakub.travnik@gmail.com>
    #
    # SPDX-License-Identifier: AGPL-3.0-or-later
    #
    # Back up the routers' running configuration into Git, one file per router,
    # and commit only when something changed: the repository's history is the
    # record of every change to the network. The flow's "Back up to Git" step
    # runs it; the inventory comes from the flow's targets and each router's
    # login from Hegemony, the Git login from a Hegemony secret.

    - name: Read the running configuration
      hosts: all
      gather_facts: false
      vars:
        # The lab's routers run FRR, whose SSH login shell is vtysh: plain SSH
        # runs the command there and returns its output.
        ansible_connection: ansible.builtin.ssh
      tasks:
        - name: Show the running configuration
          ansible.builtin.raw: show running-config
          register: running
          changed_when: false

    - name: Commit the configurations to Git
      hosts: localhost
      connection: local
      gather_facts: false
      vars:
        workdir: "{{ lookup('ansible.builtin.env', 'HOME') }}/config-backups"
        # The credentials go into the remote URL only for the commands that use
        # it, which log nothing (no_log).
        remote: "{{ git_url | regex_replace('^(https?://)', '\\1' ~ (git_username | urlencode) ~ ':' ~ (git_password | urlencode) ~ '@') }}"
      tasks:
        - name: Clone the backup repository
          ansible.builtin.command:
            argv: [git, clone, --quiet, "{{ remote }}", "{{ workdir }}"]
          changed_when: false
          no_log: true

        - name: Make the routers folder
          ansible.builtin.file:
            path: "{{ workdir }}/routers"
            state: directory
            mode: "0755"

        - name: Write one file per router
          ansible.builtin.copy:
            dest: "{{ workdir }}/routers/{{ item }}.cfg"
            content: "{{ hostvars[item].running.stdout | regex_replace('\\r', '') | trim }}\n"
            mode: "0644"
          loop: "{{ groups['all'] | sort }}"

        - name: Stage the changes
          ansible.builtin.command:
            argv: [git, -C, "{{ workdir }}", add, --all]
          changed_when: false

        - name: List what changed
          ansible.builtin.command:
            argv: [git, -C, "{{ workdir }}", diff, --cached, --stat]
          register: changes
          changed_when: changes.stdout | length > 0

        - name: Commit
          ansible.builtin.command:
            argv:
              - git
              - -C
              - "{{ workdir }}"
              - -c
              - user.name=Hegemony
              - -c
              - user.email=hegemony@lab.example
              - commit
              - --quiet
              - --message
              - "{{ commit_message }}"
          when: changes.stdout | length > 0

        - name: Push
          ansible.builtin.command:
            argv: [git, -C, "{{ workdir }}", push, --quiet, origin, HEAD]
          when: changes.stdout | length > 0
          no_log: true

        - name: Report
          ansible.builtin.debug:
            msg: "{{ changes.stdout if changes.stdout else 'No configuration changed since the last backup.' }}"
flow_subscriptions:
- flow: Announce service prefix
  destination: Approvals email
  event: approval.requested
  enabled: true
- flow: Announce service prefix
  destination: NOC email
  event: run.completed
  enabled: true
- flow: Announce service prefix
  destination: NOC email
  event: run.failed
  enabled: true
- flow: Maintenance window
  destination: NOC email
  event: approval.requested
  enabled: true
- flow: Maintenance window
  destination: NOC email
  event: approval.expired
  enabled: true
- flow: Maintenance window
  destination: NOC email
  event: run.completed
  enabled: true
- flow: Maintenance window
  destination: NOC email
  event: run.failed
  enabled: true
schedules:
- name: Weekly maintenance window
  flow: Maintenance window
  schedule_type: recurring
  cron_expression: 0 3 * * 0
  timezone: UTC
  params: {}
  enabled: false
- name: Nightly configuration backup
  flow: Configuration backup
  schedule_type: recurring
  cron_expression: 30 1 * * *
  timezone: UTC
  params: {}
  enabled: false
