frr defaults traditional
hostname dlp1-core-01
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.3/32
!
ip prefix-list SERVICES-LAN seq 10 permit 10.90.0.0/24
route-map SERVICES-LAN permit 10
 match ip address prefix-list SERVICES-LAN
!
router ospf
 ospf router-id 10.255.0.3
 network 10.255.0.3/32 area 0
 network 10.255.1.16/29 area 0
 network 10.255.1.24/29 area 0
 redistribute connected route-map SERVICES-LAN
!
line vty
!
