frr defaults traditional
hostname dlp1-edge-02
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.2/32
!
ip route 10.255.0.0/24 Null0
ip prefix-list TO-UPSTREAM seq 10 permit 10.255.0.0/24
ip prefix-list TO-UPSTREAM seq 20 permit 10.255.100.0/24 le 32
ip prefix-list TO-UPSTREAM seq 30 permit 10.90.0.0/24
route-map TO-UPSTREAM permit 10
 match ip address prefix-list TO-UPSTREAM
!
router ospf
 ospf router-id 10.255.0.2
 network 10.255.0.2/32 area 0
 network 10.255.1.24/29 area 0
 network 10.255.1.40/29 area 0
 redistribute bgp
!
router bgp 65010
 bgp router-id 10.255.0.2
 no bgp ebgp-requires-policy
 neighbor 10.255.1.10 remote-as 64500
 neighbor 10.255.1.10 description hermes-isp
 address-family ipv4 unicast
  network 10.255.0.0/24
  redistribute connected route-map TO-UPSTREAM
  redistribute ospf route-map TO-UPSTREAM
  neighbor 10.255.1.10 route-map TO-UPSTREAM out
 exit-address-family
!
line vty
!
