frr defaults traditional
hostname hermes-isp
service integrated-vtysh-config
!
interface lo
 ip address 198.51.100.1/32
!
ip route 198.51.100.0/24 Null0
!
router bgp 64500
 bgp router-id 198.51.100.1
 no bgp ebgp-requires-policy
 neighbor 10.255.1.3 remote-as 65010
 neighbor 10.255.1.3 description dlp1-edge-01
 neighbor 10.255.1.11 remote-as 65010
 neighbor 10.255.1.11 description dlp1-edge-02
 address-family ipv4 unicast
  network 198.51.100.0/24
 exit-address-family
!
line vty
!
