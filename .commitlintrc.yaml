extends:
  - "@commitlint/config-conventional"

rules:
  scope-enum:
    - 2
    - "always"
    - - ci
      - data
      - demo
      - deps
      - docs
      - generator
      - installer
      - lab
      - realm
      - rehearsal
      - release
      - stories
      - tests
